<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper and Scissors</title>
    <meta charset="UTF-8">
    <script src="myscript.js" defer></script> 
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Rock paper and scissors! choose one</h1>
    <div class="parent">
        <div class="firstContainer">
            <div>
                <img class="scissors" src="https://img.freepik.com/vector-gratis/lindas-tijeras-kawaii_24877-82375.jpg?t=st=1734737315~exp=1734740915~hmac=f67dfb4eb72a089d4ae1e9fab0a477fea438bde012eeda94c771a3e4083e3f3c&w=826">
                <div class="text">Scissors</div>
            </div>

            <div>
                <img class="paper" src="https://attic.sh/654vsivfebz3lu6ibgedzfttwnnc">
                <div class="text">Paper</div>
            </div>

            <div class="text">
                <img class="rock" src="https://us.123rf.com/450wm/pchvector/pchvector2301/pchvector230100712/197419812-top-view-of-city-stone-for-scheme-illustration-aerial-view-of-stone-street-or-park-element-for.jpg?ver=6">
                <div>Rock</div>
            </div>
        </div>
        <div class="secondContainer">
            <div>
                <div>HUMAN</div>
                <div class="scoreHuman">0</div>
            </div>

            <div>
                <div>COMPUTER</div>
                <div class="scoreComputer">0</div>
            </div>

            <div class="infoText"></div>
        </div>
    </div>
</body>
</html>
